name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build 1.21.11
        run: ./gradlew clean build

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build 26.3
        run: ./gradlew -p mc263 clean build

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/libs/yuri-addons-1.21.11-*.jar
            mc263/build/libs/yuri-addons-26.3-*.jar
          generate_release_notes: true
