name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build 1.21.11
        run: ./gradlew build

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build 26.3
        run: ./gradlew -p mc263 build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: yuri-addons
          path: |
            build/libs/*.jar
            mc263/build/libs/*.jar
