name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: ./gradlew :mc12111:build :mc263:build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: yuri-addons
          path: |
            mc12111/build/libs/*.jar
            mc263/build/libs/*.jar
